name: Spring Boot CI-CD pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: 
  contents: read
  
jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: my_db
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: ${{ secrets.PG_PW }}
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U myuser -d my_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant Maven Wrapper Permission
        run: chmod +x spring-app/mvnw

      - name: Run backend tests
        working-directory: ./spring-app
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/my_db
          SPRING_DATASOURCE_USERNAME: myuser
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.PG_PW }}
        run: ./mvnw clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-app/target/surefire-reports/
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Docker compose stack
        run: docker compose up -d --build

      - name: Check running containers
        run: docker ps

      - name: Verify Main endpoint
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8083/; then
              echo "Successfully verified.."
              exit 0
            fi
            echo "Main endpoint not ready yet.."
            sleep 5
          done
          echo "Main endpoint verification failed.."
          exit 1

      - name: Verify Health endpoint
        run: |
          for i in {1..15};do
            if curl -sf http://localhost:8083/actuator/health; then
              echo "Health checkpoint verified.."
              exit 0
            fi
            echo "Waiting for health checkpoint verification.."
            sleep 3
          done
          echo "Health Checkpoint verification failed.."
          exit 1

      - name: Show compose logs
        if: always()
        run: docker compose logs

      - name: Shutdown docker compose stack
        if: always()
        run: docker compose down

  build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and Push docker image
        uses: docker/build-push-action@v6
        with:
          context: ./spring-app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/springboot-app:latest
            ${{ secrets.DOCKER_USERNAME }}/springboot-app:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      
  
